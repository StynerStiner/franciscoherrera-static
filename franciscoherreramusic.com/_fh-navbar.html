<html><head><style id="fh-navbar-redesign">
        /* ============================================================
           Francisco Herrera — Navbar Redesign (clean-slate approach)
           Hide ALL upstream nav structures; render our own #fh-nav.
           ============================================================ */

        :root {
            --fh-bg: #0e1410;
            --fh-bg-glass: rgba(14, 20, 16, 0.82);
            --fh-border: rgba(255, 255, 255, 0.08);
            --fh-ink: #f5efe4;
            --fh-ink-dim: rgba(245, 239, 228, 0.78);
            --fh-accent: #e6b86a;
            --fh-accent-strong: #f4c87a;
            --fh-submenu-bg: #161d18;
            --fh-shadow: 0 14px 44px rgba(0, 0, 0, 0.5);
            --fh-radius: 10px;
            --fh-nav-h: 68px;
        }

        /* Pull the page out from under the fixed bar */
        html, body { padding-top: var(--fh-nav-h) !important; }

        /* Nuke every upstream nav structure so nothing competes. */
        nav#main-nav,
        nav#main-nav.mobile,
        nav#main-nav.non-mobile,
        .title-nav-container .nav-bar,
        .title-nav-container > .nav-bar,
        #toggle-mobile-menu {
            display: none !important;
        }
        /* Keep the .title-nav-container itself flowing for the title block, but stripped. */
        .title-nav-container { background: none !important; border: none !important; }

        /* ---------- Our fresh navbar ---------- */
        #fh-nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 99999;
            height: var(--fh-nav-h);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background: var(--fh-bg-glass);
            -webkit-backdrop-filter: saturate(160%) blur(16px);
            backdrop-filter: saturate(160%) blur(16px);
            border-bottom: 1px solid var(--fh-border);
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
            font-family: 'Arvo', Georgia, serif;
            color: var(--fh-ink);
        }

        #fh-nav .fh-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--fh-ink) !important;
            text-decoration: none !important;
            font-family: 'Teko', 'Arvo', sans-serif;
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-right: 24px;
            white-space: nowrap;
        }
        #fh-nav .fh-brand .fh-brand-mark {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--fh-accent) 0%, #c98842 100%);
            display: inline-block;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.12) inset;
        }

        #fh-nav .fh-menu {
            list-style: none;
            margin: 0; padding: 0;
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        #fh-nav .fh-item {
            position: relative;
            display: flex;
            align-items: center;
        }

        #fh-nav .fh-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 12px;
            color: var(--fh-ink) !important;
            text-decoration: none !important;
            font-family: 'Arvo', Georgia, serif;
            font-size: 13px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.02em;
            border-radius: 8px;
            transition: color 160ms ease, background 160ms ease;
            white-space: nowrap;
        }
        #fh-nav .fh-link::after {
            content: "";
            position: absolute;
            left: 12px; right: 12px; bottom: 4px;
            height: 1.5px;
            background: var(--fh-accent);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        #fh-nav .fh-item:hover > .fh-link,
        #fh-nav .fh-item.is-active > .fh-link {
            color: var(--fh-accent-strong) !important;
            background: rgba(255, 255, 255, 0.04);
        }
        #fh-nav .fh-item:hover > .fh-link::after,
        #fh-nav .fh-item.is-active > .fh-link::after {
            transform: scaleX(1);
        }

        #fh-nav .fh-caret {
            width: 0; height: 0;
            border-left: 3.5px solid transparent;
            border-right: 3.5px solid transparent;
            border-top: 4px solid currentColor;
            opacity: 0.7;
            transition: transform 180ms ease;
        }
        #fh-nav .fh-item:hover .fh-caret { transform: rotate(180deg); }

        /* Submenu */
        #fh-nav .fh-submenu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-6px);
            min-width: 240px;
            max-width: 360px;
            margin: 0;
            padding: 6px;
            list-style: none;
            background: var(--fh-submenu-bg);
            border: 1px solid var(--fh-border);
            border-radius: var(--fh-radius);
            box-shadow: var(--fh-shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity 160ms ease, transform 160ms ease;
            z-index: 100000;
        }
        /* hover bridge so the submenu doesn't flicker as you cross the gap */
        #fh-nav .fh-item.fh-has-submenu::after {
            content: "";
            position: absolute;
            top: 100%; left: 0; right: 0;
            height: 10px;
        }
        #fh-nav .fh-item.fh-has-submenu:hover > .fh-submenu,
        #fh-nav .fh-item.fh-has-submenu:focus-within > .fh-submenu {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        /* Edge alignment so dropdowns don't overflow the viewport */
        #fh-nav .fh-item.fh-has-submenu.fh-align-start > .fh-submenu {
            left: 0; transform: translateX(0) translateY(-6px);
        }
        #fh-nav .fh-item.fh-has-submenu.fh-align-start:hover > .fh-submenu {
            transform: translateX(0) translateY(0);
        }
        #fh-nav .fh-item.fh-has-submenu.fh-align-end > .fh-submenu {
            left: auto; right: 0; transform: translateX(0) translateY(-6px);
        }
        #fh-nav .fh-item.fh-has-submenu.fh-align-end:hover > .fh-submenu {
            transform: translateX(0) translateY(0);
        }

        #fh-nav .fh-submenu li {
            list-style: none; margin: 0; padding: 0;
        }
        #fh-nav .fh-sublink {
            display: block;
            padding: 9px 12px;
            font-family: 'Arvo', Georgia, serif;
            font-size: 12.5px;
            line-height: 1.4;
            color: var(--fh-ink-dim) !important;
            text-decoration: none !important;
            border-radius: 6px;
            transition: background 140ms ease, color 140ms ease;
            white-space: normal;
        }
        #fh-nav .fh-sublink:hover,
        #fh-nav .fh-submenu li.is-active .fh-sublink {
            color: var(--fh-accent-strong) !important;
            background: rgba(230, 184, 106, 0.10);
        }

        /* Hamburger */
        #fh-nav .fh-hamburger {
            display: none;
            margin-left: auto;
            background: none; border: none; cursor: pointer;
            color: var(--fh-ink);
            width: 40px; height: 40px;
            border-radius: 8px;
            padding: 0;
            align-items: center; justify-content: center;
            transition: background 160ms ease;
        }
        #fh-nav .fh-hamburger:hover { background: rgba(255,255,255,0.06); }
        #fh-nav .fh-hamburger span {
            display: block;
            width: 22px; height: 1.75px;
            background: currentColor;
            position: relative;
            transition: transform 200ms ease, opacity 200ms ease;
        }
        #fh-nav .fh-hamburger span::before,
        #fh-nav .fh-hamburger span::after {
            content: "";
            position: absolute;
            left: 0;
            width: 22px; height: 1.75px;
            background: currentColor;
            transition: transform 200ms ease, top 200ms ease;
        }
        #fh-nav .fh-hamburger span::before { top: -7px; }
        #fh-nav .fh-hamburger span::after  { top:  7px; }
        body.fh-menu-open #fh-nav .fh-hamburger span { background: transparent; }
        body.fh-menu-open #fh-nav .fh-hamburger span::before { top: 0; transform: rotate(45deg); }
        body.fh-menu-open #fh-nav .fh-hamburger span::after  { top: 0; transform: rotate(-45deg); }

        /* ---------- Mobile ---------- */
        @media (max-width: 960px) {
            :root { --fh-nav-h: 60px; }

            #fh-nav { padding: 0 16px; }
            #fh-nav .fh-hamburger { display: inline-flex; }

            #fh-nav .fh-menu {
                position: fixed;
                top: var(--fh-nav-h); left: 0; right: 0;
                max-height: calc(100vh - var(--fh-nav-h));
                overflow-y: auto;
                background: var(--fh-bg);
                border-bottom: 1px solid var(--fh-border);
                box-shadow: var(--fh-shadow);
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 8px 0 16px;
                transform: translateY(-12px);
                opacity: 0;
                pointer-events: none;
                transition: opacity 200ms ease, transform 200ms ease;
            }
            body.fh-menu-open #fh-nav .fh-menu {
                transform: translateY(0); opacity: 1; pointer-events: auto;
            }

            #fh-nav .fh-item { display: block; }
            #fh-nav .fh-link {
                padding: 14px 22px;
                font-size: 14px;
                border-radius: 0;
                width: 100%;
            }
            #fh-nav .fh-link::after { display: none; }
            #fh-nav .fh-caret { margin-left: auto; }
            #fh-nav .fh-item.fh-has-submenu::after { display: none; }
            #fh-nav .fh-submenu {
                position: static;
                transform: none !important;
                opacity: 1;
                pointer-events: auto;
                box-shadow: none;
                border: none;
                background: rgba(255, 255, 255, 0.025);
                border-radius: 0;
                padding: 4px 12px 8px;
                min-width: 0; max-width: none;
            }
            #fh-nav .fh-sublink { padding: 10px 18px; }
        }
    </style>
<script defer="" id="fh-navbar-init">
        (function () {
            // Detect /franciscoherreramusic.com prefix when served locally; otherwise root.
            var p = window.location.pathname;
            var m = p.match(/^(\/franciscoherreramusic\.com)(?:\/|$)/);
            var BASE = m ? m[1] : '';
            var MENU = [
                { label: 'Music — Música', href: BASE + '/music-musica' },
                { label: 'Book Now / Contrátanos', href: BASE + '/book-now-contratanos' },
                { label: 'Store / Tienda', href: BASE + '/store-tienda', children: [
                    { label: 'Honor Migrante', href: BASE + '/honor-migrante' },
                    { label: 'Francisco y L@s Niñ@s', href: BASE + '/francisco-y-l-s-nin-s' },
                    { label: 'Singles', href: BASE + '/singles' }
                ]},
                { label: 'Shows / Presentaciones', href: BASE + '/shows-presentaciones' },
                { label: 'About Francisco', href: BASE + '/about-francisco' },
                { label: 'Contact', href: BASE + '/contact-us' },
                { label: 'Blog', href: BASE + '/blog' },
                { label: 'Pensamientos', href: BASE + '/pensamientos-blog-en-espanol' },
                { label: 'Videos', href: BASE + '/videos' },
                { label: 'EPK', href: BASE + '/epk' }
            ];

            function build() {
                var path = window.location.pathname.replace(/\/+$/, '') || '/';

                var nav = document.createElement('nav');
                nav.id = 'fh-nav';
                nav.setAttribute('role', 'navigation');
                nav.setAttribute('aria-label', 'Main');

                var brand = document.createElement('a');
                brand.className = 'fh-brand';
                brand.href = BASE + '/music-musica';
                brand.innerHTML = '<span class="fh-brand-mark" aria-hidden="true"></span><span>Francisco Herrera</span>';
                nav.appendChild(brand);

                var ul = document.createElement('ul');
                ul.className = 'fh-menu';

                MENU.forEach(function (item, idx) {
                    var li = document.createElement('li');
                    li.className = 'fh-item';
                    if (item.children && item.children.length) {
                        li.classList.add('fh-has-submenu');
                        if (idx <= 1) li.classList.add('fh-align-start');
                        if (idx >= MENU.length - 2) li.classList.add('fh-align-end');
                    }

                    var a = document.createElement('a');
                    a.className = 'fh-link';
                    a.href = item.href;
                    a.textContent = item.label;
                    if (item.children && item.children.length) {
                        var caret = document.createElement('span');
                        caret.className = 'fh-caret';
                        caret.setAttribute('aria-hidden', 'true');
                        a.appendChild(caret);
                    }
                    if (item.href === path) li.classList.add('is-active');
                    li.appendChild(a);

                    if (item.children && item.children.length) {
                        var sub = document.createElement('ul');
                        sub.className = 'fh-submenu';
                        item.children.forEach(function (child) {
                            var sli = document.createElement('li');
                            var sa = document.createElement('a');
                            sa.className = 'fh-sublink';
                            sa.href = child.href;
                            sa.textContent = child.label;
                            if (child.href === path) sli.classList.add('is-active');
                            sli.appendChild(sa);
                            sub.appendChild(sli);
                        });
                        li.appendChild(sub);
                    }
                    ul.appendChild(li);
                });
                nav.appendChild(ul);

                var ham = document.createElement('button');
                ham.className = 'fh-hamburger';
                ham.type = 'button';
                ham.setAttribute('aria-label', 'Toggle menu');
                ham.innerHTML = '<span></span>';
                ham.addEventListener('click', function () {
                    document.body.classList.toggle('fh-menu-open');
                });
                nav.appendChild(ham);

                document.body.insertBefore(nav, document.body.firstChild);

                document.addEventListener('click', function (e) {
                    if (!document.body.classList.contains('fh-menu-open')) return;
                    if (!e.target.closest('#fh-nav')) {
                        document.body.classList.remove('fh-menu-open');
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', build);
            } else {
                build();
            }
        })();
    </script></head></html>
